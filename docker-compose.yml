version: '3.8'

services:
  postgres_db:
    image: postgres:15-alpine
    container_name: complaint_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: complaint_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql

  backend:
    build: .
    container_name: complaint_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DATABASE_URL: postgres://postgres:mysecretpassword@postgres_db:5432/complaint_db
      JWT_SECRET: super_secret_jwt_key_123
    depends_on:
      - postgres_db

volumes:
  pgdata:
