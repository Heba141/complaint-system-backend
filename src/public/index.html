<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
</head>
<body>
  <h2>Login</h2>
  <form action="/api/auth/login" method="POST">

    <input type="password" name="password" placeholder="Password" required><br><br>
    <button type="submit">Log In</button>
  </form>
</body>
</html>
